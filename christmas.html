<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hyva Joulua Guapa</title>

  <style>
    html, body {
      background-color: #232323;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 120px;
      padding-bottom: 144px;
      color: #f7f7f7;
      margin: 0;
      overflow-x: hidden;
    }

    h1 { font-size: 3em; margin-bottom: 0.6em; }
    p  { font-size: 1.55em; margin: 0.35em 0; color: #ffffff; }

    /* ===== CONSTANT SNOW ===== */
    .snowflake{
      position:fixed; top:-12px; pointer-events:none; z-index:9998; opacity:.9;
      animation-name:snowFall; animation-timing-function:linear; animation-iteration-count:1;
      will-change:transform,opacity; filter:drop-shadow(0 0 6px rgba(255,255,255,.12));
    }
    @keyframes snowFall{
      0%{transform:translateY(-12px) translateX(0);opacity:0}
      8%{opacity:.9}
      100%{transform:translateY(112vh) translateX(var(--drift));opacity:.15}
    }

    /* ===== TOP TREE (BACK HOME) ===== */
    #topTreeLink{display:none;margin-bottom:26px;position:relative;z-index:2;}
    #topTreeLink img{
      width:110px;max-width:30vw;cursor:pointer;
      transition:transform .2s ease, filter .2s ease;
      filter:drop-shadow(0 0 10px rgba(102,201,83,.45));
    }
    #topTreeLink img:hover{transform:scale(1.07);filter:drop-shadow(0 0 14px rgba(102,201,83,.75));}
    #topTreeLink img:active{transform:scale(.95);}

    /* ===== PASSWORD GATE ===== */
    #gate{display:block;animation:fadeIn .6s ease-out;position:relative;z-index:2;}
    input{
      margin-top:24px;padding:18px 24px;font-size:1.35em;border-radius:999px;border:none;outline:none;
      width:320px;max-width:85vw;text-align:center;
    }
    button{
      margin-top:20px;padding:18px 40px;font-size:1.35em;border:none;border-radius:999px;cursor:pointer;
      background-color:#66c953;color:#0e1a0e;font-weight:700;
      transition:transform .12s ease-out, filter .12s ease-out;
    }
    button:active{transform:scale(.96);}
    #error{margin-top:18px;color:#ff6b6b;font-weight:bold;font-size:1.2em;min-height:1.4em;}
    #specialMsg{margin-top:26px;display:none;animation:fadeIn .6s ease-out;}
    #specialMsg p{font-size:1.55em;margin:.45em 0;color:#fff;}

    /* ===== UNLOCKED CONTENT ===== */
    #content{display:none;animation:fadeIn .8s ease-out;position:relative;z-index:2;}

    /* spacing above title (change this) */
    .day-title{
      margin-top:140px;font-size:3.2em;font-weight:800;letter-spacing:.02em;
      transition:transform .28s cubic-bezier(.2,.9,.2,1), opacity .28s ease;
    }
    .day-title.pop{transform:scale(1.06);opacity:1;}

    .carousel-row{
      margin-top:54px;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 18px;position:relative;
    }

    /* ===== NAV BUTTONS ===== */
    .nav-btn{
      width:70px;height:70px;border-radius:999px;border:none;cursor:pointer;background:#ff4444;color:#fff;
      display:grid;place-items:center;padding:0;box-shadow:0 12px 30px rgba(0,0,0,.55);
      transition:transform .10s ease-out, filter .10s ease-out, opacity .10s ease-out;
      user-select:none;
    }
    .nav-btn:hover{filter:brightness(1.06);}
    .nav-btn:active{transform:scale(.95);}
    .nav-btn:disabled{opacity:.35;cursor:not-allowed;filter:none;}
    .arrow{font-size:34px;line-height:1;font-weight:900;transform:translateY(-1px);}

    .pics{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;position:relative;}

    /* Heart overlay ON TOP of images (carousel bump) */
    .heart-burst{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-55%) scale(.6);
      opacity:0;z-index:9999;pointer-events:none;font-size:56px;
      filter:drop-shadow(0 0 16px rgba(255,68,68,.35));
    }
    .heart-burst.pop{animation:heartPop .70s cubic-bezier(.2,.9,.2,1);}
    @keyframes heartPop{
      0%{opacity:0;transform:translate(-50%,-55%) scale(.6)}
      30%{opacity:1;transform:translate(-50%,-58%) scale(1.25)}
      55%{opacity:1;transform:translate(-50%,-55%) scale(1.05)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}
    }

    /* image containers */
    .pic-card{
      width:300px;max-width:38vw;min-width:210px;aspect-ratio:3/4;
      background:transparent;border:none;box-shadow:none;overflow:visible;display:grid;place-items:center;
      position:relative;z-index:1;
    }
    .pic-card img{
      width:100%;height:100%;object-fit:cover;display:block;border-radius:18px;
      box-shadow:0 18px 45px rgba(0,0,0,.60);
      opacity:1;
      transform:translateX(0) rotate(0deg) scale(1);
      transition:opacity .30s ease, transform .30s cubic-bezier(.2,.9,.2,1);
      will-change:transform,opacity;
      background:transparent;
    }

    /* simple slide animation */
    #herImg.swap-out{opacity:0;transform:translateX(-40px) rotate(-2deg) scale(.98);}
    #meImg.swap-out {opacity:0;transform:translateX(40px)  rotate(2deg)  scale(.98);}
    #herImg.swap-in {opacity:0;transform:translateX(-40px) rotate(-2deg) scale(.98);}
    #meImg.swap-in  {opacity:0;transform:translateX(40px)  rotate(2deg)  scale(.98);}

    /* meet + rotate on bump */
    #herImg.meet { transform: translateX(16px) rotate(2.2deg) scale(1.02); }
    #meImg.meet  { transform: translateX(-16px) rotate(-2.2deg) scale(1.02); }

    /* bump scale */
    .pic-card.bump{animation:bump .30s ease-out;}
    @keyframes bump{0%{transform:scale(1)}55%{transform:scale(1.03)}100%{transform:scale(1)}}

    .caption{
      margin-top:28px;font-size:1.55em;line-height:1.35;padding:0 18px;opacity:.98;
      transition:opacity .22s ease, transform .22s ease;min-height:1.4em;
      white-space: pre-line; /* ✅ THIS makes \n show as a new line */
    }
    .caption.swap-out{opacity:0;transform:translateY(8px);}
    .caption.swap-in {opacity:0;transform:translateY(-8px);}

    /* ===== FINAL SCREEN ===== */
    #finaleSection{
      display:none;margin-top:42px;padding:0 18px;animation:fadeIn .7s ease-out;position:relative;
    }
    #finaleText{
      font-size:1.75em;line-height:1.35;max-width:900px;margin:0 auto;opacity:.98;
      transition:opacity .22s ease, transform .22s ease, filter .22s ease;
    }

    #giftBtnWrap{
      margin-top:26px;
      position:relative;
      z-index:2;
      transition:opacity .22s ease, transform .22s ease, filter .22s ease;
    }

    #giftBtn{
      width:170px;max-width:50vw;cursor:pointer;user-select:none;
      transition:transform .14s ease, filter .14s ease;
      filter:drop-shadow(0 0 18px rgba(255,68,68,.22));
      transform-origin: 50% 70%;
    }
    #giftBtn:hover{transform:scale(1.06);}
    #giftBtn:active{transform:scale(.96);}

    /* ===== GIFT RATTLE (occasional) ===== */
    #giftBtn.rattle{ animation: rattle .55s ease-in-out; }
    @keyframes rattle{
      0%   { transform: rotate(0deg) scale(1); }
      12%  { transform: rotate(-6deg) scale(1.02); }
      24%  { transform: rotate(6deg)  scale(1.02); }
      36%  { transform: rotate(-5deg) scale(1.02); }
      48%  { transform: rotate(5deg)  scale(1.02); }
      60%  { transform: rotate(-3deg) scale(1.01); }
      72%  { transform: rotate(3deg)  scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* ===== DRAMATIC GIFT REVEAL (INLINE, NO POPUP) ===== */
    #giftReveal{
      display:none;
      margin-top:18px;
      position:relative;
      width:100%;
      padding:0 18px 10px;
    }

    /* explosion layer behind the image */
    #heartExplosion{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:min(760px, 96vw);
      height:420px;
      pointer-events:none;
      z-index:1;
      overflow:visible;
    }

    .boom-heart{
      position:absolute;
      left:50%;
      top:55%;
      transform:translate(-50%,-50%) scale(.5);
      opacity:0;
      font-size:28px;
      filter:drop-shadow(0 0 12px rgba(255,105,180,.35));
      animation:boom var(--dur) ease-out forwards;
      will-change:transform,opacity;
    }

    @keyframes boom{
      0%   { opacity:0; transform:translate(-50%,-50%) translate(0,0) scale(.5) rotate(-10deg); }
      15%  { opacity:1; }
      70%  { opacity:1; }
      100% { opacity:0; transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(1.35) rotate(var(--rot)); }
    }

    /* the image itself */
    #giftContentInline{
      width:min(720px, 92vw);
      height:auto;
      border-radius:18px;
      box-shadow:0 22px 70px rgba(0,0,0,.72);
      position:relative;
      z-index:2;
      opacity:0;
      transform:scale(.85) translateY(12px);
    }

    #giftContentInline.reveal{
      animation:giftRevealPop .85s cubic-bezier(.2,.95,.2,1) forwards;
    }

    @keyframes giftRevealPop{
      0%   { opacity:0; transform:scale(.82) translateY(18px); }
      55%  { opacity:1; transform:scale(1.06) translateY(0); }
      72%  { opacity:1; transform:scale(.99) translateY(0); }
      88%  { opacity:1; transform:scale(1.02) translateY(0); }
      100% { opacity:1; transform:scale(1) translateY(0); }
    }

    /* ===== HEART RAIN ===== */
    .heart{
      position:fixed;top:-60px;pointer-events:none;animation:fall linear forwards;z-index:9999;opacity:.95;
      filter:drop-shadow(0 0 10px rgba(255,105,180,.5));
    }
    @keyframes fall{to{ transform:translateY(120vh) rotate(360deg); opacity:.25; }}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .snowflake, .heart, .pic-card img, .caption, .pic-card.bump, .heart-burst.pop,
      .boom-heart, #giftContentInline.reveal, #giftBtn.rattle {
        animation: none !important;
        transition: none !important;
      }
      #giftContentInline{opacity:1;transform:none;}
    }
  </style>
</head>

<body>

  <!-- PASSWORD GATE -->
  <div id="gate">
    <h1>✨🎄 Entrada secreta 🎄✨</h1>
    <p>Introduce la contraseña</p>

    <input id="password" type="text" placeholder="Password" autocomplete="off" />
    <br>
    <button onclick="unlock()">Entrar</button>

    <div id="error"></div>

    <div id="specialMsg">
      <p id="line1"></p>
      <p id="line2"></p>
      <p id="line3"></p>
    </div>
  </div>

  <!-- UNLOCKED CONTENT -->
  <div id="content">

    <div id="topTreeLink">
      <a href="index.html" aria-label="Back to main page">
        <img src="christmas-tree.png" alt="Back to main page">
      </a>
    </div>

    <h1>Feliz navidad Evelia 🇵🇪</h1>
    <p>❤️🎄🎁❤️</p>

    <h1>Hyvää joulua 🇫🇮</h1>
    <p>❤️🎄🎁❤️</p>

    <div class="day-title" id="dayTitle"></div>

    <div class="carousel-row" id="carouselRow">
      <button class="nav-btn" id="prevBtn" aria-label="Previous day">
        <span class="arrow">❮</span>
      </button>

      <div class="pics" id="picsWrap">
        <div class="heart-burst" id="burstHeart">❤️</div>

        <div class="pic-card" id="herCard">
          <img id="herImg" src="" alt="Her pic">
        </div>
        <div class="pic-card" id="meCard">
          <img id="meImg" src="" alt="My pic">
        </div>
      </div>

      <button class="nav-btn" id="nextBtn" aria-label="Next day">
        <span class="arrow">❯</span>
      </button>
    </div>

    <div class="caption" id="captionText"></div>

    <!-- FINAL SCREEN -->
    <div id="finaleSection">
      <div id="finaleText">
        Alguien perdió el celular... Me diste un infarto tonta, lista para abrir tu regalo?
      </div>

      <div id="giftBtnWrap">
        <img id="giftBtn" src="days/gift-button.png" alt="Open gift button">
      </div>

      <!-- DRAMATIC INLINE REVEAL -->
      <div id="giftReveal">
        <div id="heartExplosion"></div>
        <img id="giftContentInline" src="days/princesa.png" alt="Mi Princesa Evelia">
        <!-- ✅ NEW: caption under the final image (same style as day captions) -->
        <div class="caption" id="giftCaption"></div>
      </div>
    </div>
  </div>

  <script>
    const PASSWORD_NORMAL = "99%";

    // ✅ You asked to lower the amount to 17 total slides.
    // We'll make this: Day 3 -> 18 (16 slides) + FINAL (1) = 17 total.

    // ===== EDIT CUTE TEXTS HERE (per day) =====
    // Just change the strings. If a day is missing here, it falls back to default.
    const DAY_TEXT = {
      3: "No sabes cómo adoro esta fotooo tuya 😍😍😍",
      4: "Messi Fan 👍",
      5: "Ojalá mis brazos fueran muy... muy... largos\n para abrazarte desde aquí, cuando tus días sean amargos",
      6: "Más bonito que ver a Messi campeón, es ver tu sonrisa para mí.\n Por eso subirme en un avión, es lo que me haría tan feliz",
      7: "Si tan solo hubiera entendido que el premio de aquella feria, era tu compañía...\n te habría abrazado más fuerte aquel día \n \n Hay un peluche con tu nombre en mi maleta, te lo doy a cambio de una cita",
      8: "7 besos tuyos llenarían de dulzura este amor más que ningún alfajor jamás podría",
      9: "Los dos olvidamos foto 🥲🥲",
      10: "Ya que no me dejas agarrar tu mano en el cine, dejame entrelazar nuestros pies cómo cuellos de cisne 👣🦢👣",
      11: "Pieeees 👣",
      12: "Mi princesa favorita eres tú, ojos de esmeralda y cabello de oro \n Mi cuento empieza y termina, cuando sonríes de ese modo",
      13: "Hay calles tan bonitas en málaga... \n pero ninguna como ese tramo, que caminamos a ciegas de la mano",
      14: "🎵🎶Era Peter un reno, que tenía una nariz... Roja cómo una grana...🎶🎵",
      15: "Te juro que los que te prepare a tí por las mañanas serán mas lindos :(",
      16: "Tú y yo deberiamos jugar minecraft, de niñito dije a mi amigo que me queria casar con una chica que juegue maincraf",
      17: "No son mejores que las flores que te llevé en nuestra primera cita verdad?",
      18: "Re tonta la foto, lo sé, pero es dificil encontrar algo interesante, \n aún así, no hay nada más dificil que todo el día no pensarte."
    };

    // ✅ NEW: final gift caption text (same style, supports \n)
    const GIFT_CAPTION_TEXT = "Feliz Navidad mi princesa 🎄❤️\nTe adoro un montón.\n \n \n Aquí tenía la segunda parte del regalo, un poema y buenas noticias, pero me pareció mejor borrarlo, no creo que lo quieras todavía, el dibujo sí... Me demoré tanto en aprender a dibujar solo para este regalo que quería que lo vieras. \n \n En cambio quería aprovechar el espacio para desearte lo mejor, eres una chica increíble, mereces el mundo entero. No te guardo ningún tipo de rencor, sé que a distancia ese tipo de cosas suelen pasar, \n \n \n Pero bueno, mentiría si te diría que parte de mí no hubiera querido que yo te guste a ti de la misma manera en la que tú me gustaste a mí. \n \n Te mando un abrazo re fuerte, realmente me hubiera gustado verte aunque sea una vez más, ahora que te conozco tanto y sé que lo que siento por ti es real. Siempre te recordaré con buenos ojos, ojos verdes jaja, espero te acuerdes de lo bueno. \n \n \n En fin gracias Evelia por estos 6 increíbles meses, quizá en otra vida no te perdía tan pronto. ";

    // ✅ Forget placeholders:
    const I_FORGET_DAYS = [9,12];
    const SHE_FORGET_DAYS = [11,13,14,15,16,17,18];
    const WE_BOTH_FORGET_DAYS = [9];

    function getDayPaths(day) {
      // both forget has priority
      if (WE_BOTH_FORGET_DAYS.includes(day)) {
        return { her: "days/we-forget1.png", me: "days/we-forget2.png" };
      }
      const herPath = SHE_FORGET_DAYS.includes(day) ? "days/her-forget.png" : `days/her-${day}.png`;
      const mePath  = I_FORGET_DAYS.includes(day)   ? "days/me-forget.png"  : `days/mine-${day}.png`;
      return { her: herPath, me: mePath };
    }

    // Days 3 -> 18 (inclusive) = 16 days
    const START_DAY = 3;
    const END_DAY = 18;
    const DAYS_COUNT = (END_DAY - START_DAY) + 1; // 16

    const daysData = Array.from({ length: DAYS_COUNT }, (_, i) => {
      const day = START_DAY + i; // starts at 3
      const paths = getDayPaths(day);

      return {
        day,
        her: paths.her,
        me: paths.me,
        text: DAY_TEXT[day] ?? `some cute text for day ${day}`
      };
    });

    // FINAL slide
    const TOTAL_SLIDES = daysData.length + 1;

    let currentIndex = 0;
    let heartRainRunning = false;
    let isAnimating = false;
    let lastNavTime = 0;

    let giftRattleTimer = null;
    let giftRevealed = false;

    /* ===== CONSTANT SNOW ===== */
    const MAX_SNOWFLAKES = 70;
    const snowState = { count: 0 };

    function spawnSnowflake() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (snowState.count > MAX_SNOWFLAKES) return;

      const flake = document.createElement("div");
      flake.className = "snowflake";
      flake.textContent = "❄";

      const size = Math.random() * 14 + 10;
      flake.style.fontSize = size + "px";
      flake.style.left = Math.random() * 100 + "vw";

      const duration = Math.random() * 6 + 6;
      const drift = (Math.random() * 70 - 35) + "px";
      flake.style.setProperty("--drift", drift);
      flake.style.animationDuration = duration + "s";
      flake.style.opacity = (Math.random() * 0.5 + 0.35).toFixed(2);

      document.body.appendChild(flake);
      snowState.count++;

      setTimeout(() => {
        flake.remove();
        snowState.count--;
      }, duration * 1000 + 200);
    }

    setInterval(spawnSnowflake, 180);
    for (let i = 0; i < 18; i++) setTimeout(spawnSnowflake, i * 120);

    /* ===== PASSWORD PARSING: triggers >= 100% easter egg ===== */
    function parsePercentInput(str) {
      const cleaned = (str || "").trim().replace(",", ".");
      const match = cleaned.match(/-?\d+(\.\d+)?/);
      if (!match) return null;
      return parseFloat(match[0]);
    }

    function runEasterEgg() {
      startHeartRain();
      showSpecialMsgSequence();
      password.value = "";
    }

    /* ===== GATE ===== */
    function unlock() {
      const inputRaw = password.value.trim();
      const inputLower = inputRaw.toLowerCase();

      error.textContent = "";
      hideSpecialMsg();

      // ===== NEW WORD EASTER EGGS =====
      if (inputLower === "monton") {
        error.textContent = "No mi amor, a mí me gustas un montón, pero es un porcentaje % lo que te pido.";
        return;
      }
      if (inputLower === "mucho") {
        error.textContent = "No mi amor, mucho es lo que te extraño, es un porcentaje % lo que te pido.";
        return;
      }
      if (inputLower === "toda") {
        error.textContent = "No mi amor, cuando te tenga en frente te voy a hacer toda mía, ahora es un porcentaje % lo que te pido.";
        return;
      }
      if (inputLower === "evelia") {
        error.textContent = "La dueña de mi corazón";
        return;
      }
      if (inputLower === "11/06/25") {
        error.textContent = "El día que llegaste a mi vida";
        return;
      }

      // "0 %", "0%", "0   %" etc.
      if (/^0\s*%$/.test(inputLower)) {
        error.textContent = "Me pregunto de quién eres ahora, pero en realidad, ya lo sé.";
        return;
      }
      // ==============================

      const p = parsePercentInput(inputRaw);
      if (p !== null && p >= 100) {
        runEasterEgg();
        return;
      }

      if (inputRaw === PASSWORD_NORMAL) {
        gate.style.display = "none";
        content.style.display = "block";
        topTreeLink.style.display = "block";
        renderCurrent(true);
      } else {
        error.textContent = "Hint: Que tanto % eres mia? 😤";
      }
    }

    /* ===== PRELOAD ===== */
    function preloadIndex(idx) {
      if (idx < 0 || idx >= daysData.length) return;
      const d = daysData[idx];
      new Image().src = d.her;
      new Image().src = d.me;
    }

    // ===== (1) BUMP ICON SWITCH =====
    function getBumpEmojiForDay(dayNumber) {
      // thumbs up ONLY for picture day 4
      if (dayNumber === 4) return "👍";
      return "❤️";
    }

    function popBurstHeart(dayNumber) {
      // set emoji before animating
      burstHeart.textContent = getBumpEmojiForDay(dayNumber);

      burstHeart.classList.remove("pop");
      void burstHeart.offsetWidth;
      burstHeart.classList.add("pop");
    }

    function updateNavState() {
      const isFinal = currentIndex === TOTAL_SLIDES - 1;

      if (isFinal) {
        prevBtn.style.display = "none";
        nextBtn.style.display = "none";
        return;
      }

      prevBtn.style.display = "grid";
      nextBtn.style.display = "grid";
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = false;
    }

    function startGiftRattle() {
      stopGiftRattle();
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      function scheduleNext() {
        if (giftRevealed) return;

        const delay = 1600 + Math.random() * 2600; // 1.6s–4.2s
        giftRattleTimer = setTimeout(() => {
          if (giftRevealed) return;
          giftBtn.classList.remove("rattle");
          void giftBtn.offsetWidth;
          giftBtn.classList.add("rattle");
          scheduleNext();
        }, delay);
      }

      scheduleNext();
    }

    function stopGiftRattle() {
      if (giftRattleTimer) {
        clearTimeout(giftRattleTimer);
        giftRattleTimer = null;
      }
      if (typeof giftBtn !== "undefined" && giftBtn) {
        giftBtn.classList.remove("rattle");
      }
    }

    function showFinale() {
      dayTitle.textContent = `Joulupäivää`;
      dayTitle.style.display = "block";
      dayTitle.classList.remove("pop");
      requestAnimationFrame(() => dayTitle.classList.add("pop"));
      setTimeout(() => dayTitle.classList.remove("pop"), 240);

      picsWrap.style.display = "none";
      captionText.style.display = "none";
      finaleSection.style.display = "block";

      giftReveal.style.display = "none";
      giftContentInline.classList.remove("reveal");
      heartExplosion.innerHTML = "";
      finaleText.style.display = "block";
      giftBtnWrap.style.display = "block";

      // ✅ NEW: reset final caption
      giftCaption.textContent = "";
      giftCaption.style.display = "none";

      giftRevealed = false;
      startGiftRattle();

      updateNavState();
    }

    function hideFinale() {
      picsWrap.style.display = "flex";
      captionText.style.display = "block";
      finaleSection.style.display = "none";
      stopGiftRattle();
      dayTitle.style.display = "block";
    }

    function renderDay(isFirst = false) {
      const d = daysData[currentIndex];

      dayTitle.textContent = `Joulukalenteri: Dia ${d.day}`;
      dayTitle.style.display = "block";
      dayTitle.classList.remove("pop");
      requestAnimationFrame(() => dayTitle.classList.add("pop"));
      setTimeout(() => dayTitle.classList.remove("pop"), 240);

      updateNavState();
      preloadIndex(currentIndex + 1);
      preloadIndex(currentIndex - 1);

      if (isFirst) {
        herImg.src = d.her;
        meImg.src = d.me;
        captionText.textContent = d.text || "";
        return;
      }

      if (isAnimating) return;
      isAnimating = true;

      herImg.classList.add("swap-out");
      meImg.classList.add("swap-out");
      captionText.classList.add("swap-out");

      prevBtn.disabled = true;
      nextBtn.disabled = true;

      setTimeout(() => {
        herImg.classList.remove("swap-out");
        meImg.classList.remove("swap-out");
        captionText.classList.remove("swap-out");

        herImg.classList.add("swap-in");
        meImg.classList.add("swap-in");
        captionText.classList.add("swap-in");

        herImg.src = d.her;
        meImg.src = d.me;
        captionText.textContent = d.text || "";

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            herImg.classList.remove("swap-in");
            meImg.classList.remove("swap-in");
            captionText.classList.remove("swap-in");

            herCard.classList.add("bump");
            meCard.classList.add("bump");

            herImg.classList.add("meet");
            meImg.classList.add("meet");

            // ✅ this now shows 👍 only on day 4
            popBurstHeart(d.day);

            setTimeout(() => {
              herCard.classList.remove("bump");
              meCard.classList.remove("bump");
              herImg.classList.remove("meet");
              meImg.classList.remove("meet");

              updateNavState();
              isAnimating = false;
            }, 280);
          });
        });
      }, 170);
    }

    function renderCurrent(isFirst = false) {
      const isFinal = currentIndex === TOTAL_SLIDES - 1;
      if (isFinal) { showFinale(); return; }
      hideFinale();
      renderDay(isFirst);
    }

    // ===== NAV (faster presses) =====
    function canNavNow() {
      const now = Date.now();
      if (now - lastNavTime < 120) return false;
      lastNavTime = now;
      return true;
    }

    prevBtn.addEventListener("click", () => {
      if (!canNavNow()) return;
      if (isAnimating) return;
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrent();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (!canNavNow()) return;
      if (isAnimating) return;
      if (currentIndex < TOTAL_SLIDES - 1) {
        currentIndex++;
        renderCurrent();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (content.style.display !== "block") return;
      if (isAnimating) return;

      if (e.key === "ArrowLeft" && currentIndex > 0) {
        currentIndex--;
        renderCurrent();
      }
      if (e.key === "ArrowRight" && currentIndex < TOTAL_SLIDES - 1) {
        currentIndex++;
        renderCurrent();
      }
    });

    // ===== FINAL: DRAMATIC REVEAL + HEART RAIN MIX =====
    function preloadGiftAssets() {
      new Image().src = "days/gift-content.png";
      new Image().src = "days/gift-button.png";
    }
    preloadGiftAssets();

    function heartExplosionBurst(total = 44) {
      heartExplosion.innerHTML = "";
      const emojis = ["❤️","💖","💕","💗","💘"];

      for (let i = 0; i < total; i++) {
        const h = document.createElement("div");
        h.className = "boom-heart";
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        const angle = Math.random() * Math.PI * 2;
        const radius = 130 + Math.random() * 240;
        const dx = Math.cos(angle) * radius;
        const dy = Math.sin(angle) * radius * 0.7;

        h.style.setProperty("--dx", dx.toFixed(0) + "px");
        h.style.setProperty("--dy", dy.toFixed(0) + "px");
        h.style.setProperty("--rot", (Math.random() * 160 - 80).toFixed(0) + "deg");

        const delay = Math.random() * 0.25;
        h.style.animationDelay = delay.toFixed(2) + "s";
        h.style.fontSize = (22 + Math.random() * 28).toFixed(0) + "px";

        const dur = 4.0 + Math.random() * 1.2; // 4.0–5.2 seconds
        h.style.setProperty("--dur", dur.toFixed(2) + "s");

        heartExplosion.appendChild(h);
        setTimeout(() => h.remove(), (dur + delay) * 1000 + 80);
      }
    }

    function revealGiftDramatic() {
      giftRevealed = true;
      stopGiftRattle();

      // hide the Joulukalenteri title too
      dayTitle.style.display = "none";

      finaleText.style.display = "none";
      giftBtnWrap.style.display = "none";

      giftReveal.style.display = "block";

      // ✅ NEW: set and show final caption
      giftCaption.textContent = GIFT_CAPTION_TEXT;
      giftCaption.style.display = "block";

      heartExplosionBurst(52);

      giftContentInline.classList.remove("reveal");
      void giftContentInline.offsetWidth;
      giftContentInline.classList.add("reveal");

      startHeartRainFor(4500);

      setTimeout(() => {
        giftReveal.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 120);
    }

    giftBtn.addEventListener("click", revealGiftDramatic);

    // ===== SPECIAL >= 100% =====
    function showSpecialMsgSequence() {
      specialMsg.style.display = "block";
      line1.textContent = "";
      line2.textContent = "";
      line3.textContent = "";

      setTimeout(() => line1.textContent = "NAHHHH ME ENCANTAS", 150);
      setTimeout(() => line2.textContent = "pero todavia no eres mi novia loquita", 900);
      setTimeout(() => line3.textContent = "intenta de nuevo", 1700);
    }

    function hideSpecialMsg() {
      specialMsg.style.display = "none";
      line1.textContent = "";
      line2.textContent = "";
      line3.textContent = "";
    }

    // ===== HEART RAIN (shared) =====
    function startHeartRain() {
      if (heartRainRunning) { burstHearts(50); return; }
      heartRainRunning = true;
      burstHearts(110);
      const interval = setInterval(() => burstHearts(22), 500);
      setTimeout(() => { clearInterval(interval); heartRainRunning = false; }, 8000);
    }

    function startHeartRainFor(ms) {
      burstHearts(90);
      const interval = setInterval(() => burstHearts(18), 420);
      setTimeout(() => clearInterval(interval), ms);
    }

    function burstHearts(count) {
      const hearts = ["❤️", "💖", "💕", "💗", "💘"];
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

        const size = Math.random() * 30 + 20;
        heart.style.fontSize = size + "px";
        heart.style.left = Math.random() * 100 + "vw";

        const duration = Math.random() * 3 + 3.5;
        const delay = Math.random() * 0.8;
        heart.style.animationDuration = duration + "s";
        heart.style.animationDelay = delay + "s";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), (duration + delay) * 1000);
      }
    }

    password.addEventListener("keydown", e => {
      if (e.key === "Enter") unlock();
    });
  </script>

</body>
</html>
